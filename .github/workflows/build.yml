name: Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev/v*.x
      - dev/v*/v*.*
      - alpha/v*/v*.*

permissions:
  contents: read

concurrency:
  group: libnode-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: kungfu-systems/buildchain/.github/workflows/.build.yml@v1.0.9
    with:
      buildchain-ref: v1.0.9
      runner-preset: kungfu-v4-self-hosted
      setup-node: true
      node-version: "24"
      install-command: node .gyp/buildchain-install.js "${{ vars.KF_NODE_GIT_URL }}" "${{ vars.KF_NODE_REFERENCE }}"
      require-install: true
      require-build: true
      require-verify: true
      artifact-name: libnode
      artifact-name-template: "{artifact}-{platform}-{shortSha}-{runId}-{runAttempt}"
      artifact-paths: |
        build/stage
      expected-artifacts-json: >-
        {"minFiles":1,"minTotalBytes":1}
      artifact-retention-days: 14
