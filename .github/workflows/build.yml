name: Build
on:
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Type node version to build'
        required: true
        default: 'v14.18.0'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: '["self-hosted","kungfu-build-v4-linux-x64"]'
            name: "Linux"
          - runner: '["self-hosted","kungfu-build-v4-macos-arm64"]'
            name: "MacOS-arm64"
          - runner: '["self-hosted","kungfu-build-v4-windows-x64"]'
            name: "Windows"
    runs-on: ${{ fromJSON(matrix.runner) }}
    env:
      USE_HARD_LINKS: false
      BUILDER_OS: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          submodules: recursive

      - name: Setup Python environment
        if: matrix.name != 'Linux'
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.9"

      - name: Setup Windows environment
        if: matrix.name == 'Windows'
        uses: crazy-max/ghaction-chocolatey@v1
        with:
          args: install -y nasm --no-progress

      - name: Setup Windows PATH for nasm
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path "${env:ProgramFiles}" | Where-Object {($_.Name -Like 'NASM*')} | % { $_.FullName } | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
      
      - name: Build
        uses: ./.github/actions/builder
