name: Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev/v*.x
      - dev/v*/v*.*
      - alpha/v*/v*.*
      - release/v*/v*.*

permissions:
  contents: read
  id-token: write

concurrency:
  group: libnode-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: kungfu-systems/buildchain/.github/workflows/.build.yml@v2
    with:
      runner-preset: kungfu-v4-self-hosted
      artifact-transfer-mode: s3-to-github-artifacts
      setup-node: true
      node-version: '24'
      install-command: node .gyp/buildchain-install.js "${{ vars.KF_NODE_GIT_URL }}" "${{ vars.KF_NODE_REFERENCE }}"
      require-install: true
      require-build: true
      require-verify: true
      artifact-name: libnode
      artifact-name-template: '{artifact}-{platform}-{sha}'
      artifact-paths: |
        build/stage
      release-candidate: ${{ startsWith(github.base_ref, 'alpha/') || startsWith(github.base_ref, 'release/') }}
      publish-channel: ${{ startsWith(github.base_ref, 'alpha/') && 'alpha' || startsWith(github.base_ref, 'release/') && 'release' || 'none' }}
      expected-artifacts-json: >-
        {"minFiles":1,"minTotalBytes":10000000}
      artifact-retention-days: 14
