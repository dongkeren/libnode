name: Build

on:
  workflow_dispatch:
    inputs:
      buildchain-ref:
        description: 'Temporary Buildchain runtime ref for trusted manual validation'
        required: false
        default: ''
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev/v*.x
      - dev/v*/v*.*
      - alpha/v*/v*.*
      - release/v*/v*.*

permissions:
  contents: read

concurrency:
  group: libnode-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: kungfu-systems/buildchain/.github/workflows/.build.yml@v2
    with:
      buildchain-ref: ${{ inputs.buildchain-ref || '' }}
      runner-preset: kungfu-v4-self-hosted
      setup-node: true
      node-version: '24'
      install-command: node .gyp/buildchain-install.js "${{ vars.KF_NODE_GIT_URL }}" "${{ vars.KF_NODE_REFERENCE }}"
      require-install: true
      require-build: true
      require-verify: true
      artifact-name: libnode
      artifact-name-template: '{artifact}-{platform}-{sha}'
      release-candidate: true
      artifact-paths: |
        build/stage
      expected-artifacts-json: >-
        {"minFiles":1,"minTotalBytes":10000000}
      artifact-retention-days: 14
