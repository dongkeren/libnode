name: Release - New Version
on:
  pull_request:
    types: [closed]
    branches:
      - release/v*.x
      - release/v*/v*.*

jobs:
  build:
    if: ${{ github.event.pull_request.merged }}
    uses: kungfu-systems/buildchain/.github/workflows/.build.yml@v2
    with:
      buildchain-ref: v2
      runner-preset: kungfu-v4-self-hosted
      setup-node: true
      node-version: '24'
      install-command: node .gyp/buildchain-install.js "${{ vars.KF_NODE_GIT_URL }}" "${{ vars.KF_NODE_REFERENCE }}"
      require-install: true
      require-build: true
      require-verify: true
      artifact-name: libnode
      artifact-name-template: '{artifact}-{platform}-{sha}'
      artifact-paths: |
        build/stage
      expected-artifacts-json: >-
        {"minFiles":1,"minTotalBytes":1}
      artifact-retention-days: 14

  publish-npmjs:
    if: ${{ github.event.pull_request.merged }}
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: 'github-artifacts'

      - name: Publish NPM Tarballs
        run: node .gyp/npm-publish-tarballs.js github-artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUSH_TOKEN }}
