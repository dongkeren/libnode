name: Release - New Version
on:
  pull_request:
    types: [closed]
    branches:
      - release/v*.x
      - release/v*/v*.*

jobs:
  publish-aws:
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Configure AWS Credentials (CI)
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Publish Prebuilt to AWS (CI)
        uses: kungfu-systems/buildchain/actions/publish-prebuilt@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          bucket-staging: 'kungfu-prebuilt-staging'
          bucket-release: 'kungfu-prebuilt'
          no-comment: 'true'

      - name: Configure AWS Credentials (User)
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_USER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_USER_SECRET_ACCESS_KEY }}
          aws-region: cn-northwest-1

      - name: Publish Prebuilt to AWS (User)
        uses: kungfu-systems/buildchain/actions/publish-prebuilt@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          bucket-staging: 'kungfu-prebuilt-staging'
          bucket-release: 'kungfu-prebuilt'

  publish-npmjs:
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM Packages
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUSH_TOKEN }}
