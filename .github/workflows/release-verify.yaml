name: Release - Verify
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - release/v*.x

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: '["self-hosted","kungfu-build-v4-linux-x64"]'
            name: "Linux"
          - runner: '["self-hosted","kungfu-build-v4-macos-arm64"]'
            name: "MacOS-arm64"
          - runner: '["self-hosted","kungfu-build-v4-windows-x64"]'
            name: "Windows"
    runs-on: ${{ fromJSON(matrix.runner) }}
    env:
      USE_HARD_LINKS: false
      BUILDER_OS: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          submodules: recursive

      - name: Setup Python environment
        if: matrix.name != 'Linux'
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.9"

      - name: Setup Windows environment
        if: matrix.name == 'Windows'
        uses: crazy-max/ghaction-chocolatey@v1
        with:
          args: install -y nasm --no-progress

      - name: Setup Windows PATH for nasm
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path "${env:ProgramFiles}" | Where-Object {($_.Name -Like 'NASM*')} | % { $_.FullName } | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
      
      - name: Build
        uses: ./.github/actions/builder

  release:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: "github-artifacts"

      - name: Configure AWS Credentials (CI)
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Stage Prebuilt to AWS (CI)
        uses: kungfu-systems/buildchain/actions/publish-prebuilt@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts-path: "github-artifacts"
          bucket-staging: "kungfu-prebuilt-staging"
          no-comment: "true"

      - name: Configure AWS Credentials (User)
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_USER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_USER_SECRET_ACCESS_KEY }}
          aws-region: cn-northwest-1

      - name: Stage Prebuilt to AWS (User)
        uses: kungfu-systems/buildchain/actions/publish-prebuilt@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts-path: "github-artifacts"
          bucket-staging: "kungfu-prebuilt-staging"
