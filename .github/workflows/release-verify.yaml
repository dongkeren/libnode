name: Release - Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - release/v*.x
      - release/v*/v*.*

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: libnode-release-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: kungfu-systems/buildchain/.github/workflows/.build.yml@v2
    with:
      runner-preset: kungfu-v4-self-hosted
      buildchain-contract-lock-path: buildchain.contract-lock.json
      buildchain-contract-drift-issue-mode: compatible-and-breaking
      artifact-transfer-mode: s3-to-github-artifacts
      checkout-cache-mode: auto
      checkout-cache-mirror-url-template: ${{ vars.BUILDCHAIN_CHECKOUT_CACHE_MIRROR_URL_TEMPLATE }}
      checkout-cache-fallback: github
      checkout-cache-timeout-seconds: 60
      setup-node: true
      node-version: '24'
      install-command: node .gyp/buildchain-install.js "${{ vars.KF_NODE_GIT_URL }}" "${{ vars.KF_NODE_REFERENCE }}"
      require-install: true
      require-build: true
      require-verify: true
      artifact-name: libnode
      artifact-name-template: '{artifact}-{platform}-{sha}'
      artifact-paths: |
        build/stage
      release-candidate: true
      publish-channel: release
      expected-artifacts-json: >-
        {"minFiles":1,"minTotalBytes":10000000}
      artifact-retention-days: 14
