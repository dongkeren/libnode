name: Release - Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - release/v*.x

permissions:
  contents: read

concurrency:
  group: libnode-release-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: kungfu-systems/buildchain/.github/workflows/.build.yml@v1.0.9
    with:
      buildchain-ref: v1.0.9
      runner-preset: kungfu-v4-self-hosted
      setup-node: true
      node-version: "24"
      install-command: node .gyp/buildchain-install.js "${{ vars.KF_NODE_GIT_URL }}" "${{ vars.KF_NODE_REFERENCE }}"
      require-install: true
      require-build: true
      require-verify: true
      artifact-name: libnode
      artifact-name-template: "{artifact}-{platform}-{shortSha}-{runId}-{runAttempt}"
      artifact-paths: |
        build/stage
      expected-artifacts-json: >-
        {"minFiles":1,"minTotalBytes":1}
      artifact-retention-days: 14

  release:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Download Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: "github-artifacts"

      - name: Configure AWS Credentials (CI)
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_CI_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Stage Prebuilt to AWS (CI)
        uses: kungfu-systems/buildchain/actions/publish-prebuilt@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts-path: "github-artifacts"
          bucket-staging: "kungfu-prebuilt-staging"
          no-comment: "true"

      - name: Configure AWS Credentials (User)
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_USER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_USER_SECRET_ACCESS_KEY }}
          aws-region: cn-northwest-1

      - name: Stage Prebuilt to AWS (User)
        uses: kungfu-systems/buildchain/actions/publish-prebuilt@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts-path: "github-artifacts"
          bucket-staging: "kungfu-prebuilt-staging"
