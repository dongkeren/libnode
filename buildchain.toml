schema = 1

[version]
required = true
strategy = "anchored"
next = "manual"
manifest = "libnode.release.json"

[[version.files]]
type = "json"
path = "package.json"
key = "version"

[[version.files]]
type = "json"
path = "libnode.release.json"
key = "npmVersion"

[publish]
mode = "publish-final-version"
auth = "trusted-publishing"
package_set_order = "platforms-first-main-last"
main_package = "@kungfu-tech/libnode"

[lifecycle]

[lifecycle.env]
KF_SKIP_FALLBACK_BUILD = "true"
KF_COMPILER_CACHE = "auto"

[lifecycle.install]
timeout_minutes = 10
commands = [
  "node .gyp/buildchain-install.js",
]

[lifecycle.build]
timeout_minutes = 240
commands = [
  "node .gyp/buildchain-diagnostics.js snapshot lifecycle-build-start",
  "corepack pnpm build",
  "node .gyp/buildchain-diagnostics.js snapshot lifecycle-build-after-node-gyp",
  "corepack pnpm package",
  "node .gyp/buildchain-diagnostics.js snapshot lifecycle-build-end",
]

[lifecycle.verify]
timeout_minutes = 10
commands = [
  "node .gyp/buildchain-diagnostics.js snapshot lifecycle-verify-start",
  "corepack pnpm verify-release",
  "corepack pnpm verify-package-source",
  "git diff --check",
  "node .gyp/buildchain-diagnostics.js snapshot lifecycle-verify-end",
]

[lifecycle.publish]
timeout_minutes = 20
command = "node .gyp/npm-publish-tarballs.js github-artifacts"
