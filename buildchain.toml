schema = 1

[version]
required = true

[[version.files]]
type = "json"
path = "package.json"
key = "version"

[lifecycle]

[lifecycle.env]
KF_SKIP_FALLBACK_BUILD = "true"
KF_COMPILER_CACHE = "auto"

[lifecycle.install]
timeout_minutes = 10
commands = [
  "corepack yarn --network-timeout=5000000 install --frozen-lockfile --ignore-scripts",
  "node .gyp/node-npm-config.js",
  "corepack yarn prepare-node-source",
]

[lifecycle.build]
timeout_minutes = 240
commands = [
  "corepack yarn make",
  "node .gyp/run-with-env.js KF_SKIP_MAKE_LIBNODE=true -- corepack yarn build",
  "corepack yarn package",
]

[lifecycle.verify]
timeout_minutes = 10
commands = [
  "corepack yarn verify-release",
  "git diff --check",
]
