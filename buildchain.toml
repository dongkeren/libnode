schema = 1

[version]
required = true
strategy = "anchored"
next = "manual"
manifest = "libnode.release.json"

[[version.files]]
type = "json"
path = "package.json"
key = "version"

[lifecycle]

[lifecycle.env]
KF_SKIP_FALLBACK_BUILD = "true"
KF_COMPILER_CACHE = "auto"

[lifecycle.install]
timeout_minutes = 10
commands = [
  "corepack pnpm install --frozen-lockfile --ignore-scripts",
  "node .gyp/node-npm-config.js",
  "corepack pnpm prepare-node-source",
]

[lifecycle.build]
timeout_minutes = 240
commands = [
  "corepack pnpm make",
  "node .gyp/run-with-env.js KF_SKIP_MAKE_LIBNODE=true -- corepack pnpm build",
  "corepack pnpm package",
]

[lifecycle.verify]
timeout_minutes = 10
commands = [
  "corepack pnpm verify-release",
  "git diff --check",
]
